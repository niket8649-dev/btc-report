name: Stock Entry Alert

on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'  # 평일 미국장 시간 (UTC 13~21 = KST 22~06) 30분마다
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install yfinance ta pandas numpy requests python-dotenv

      - name: 워치리스트 복원
        uses: actions/cache@v4
        with:
          path: stock_watchlist.json
          key: stock-watchlist-${{ github.run_id }}
          restore-keys: stock-watchlist-

      - name: 알림 상태 복원
        uses: actions/cache@v4
        with:
          path: stock_alert_state.json
          key: stock-alert-state-${{ github.run_id }}
          restore-keys: stock-alert-state-

      - name: 진입 조건 체크 및 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_alert.py
